[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../scripts"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pyright]
venvPath = ".."
venv = ".venv"
include = ["aire_windows", "main.py"]
extraPaths = ["../scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
