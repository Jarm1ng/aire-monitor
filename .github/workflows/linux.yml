name: Linux desktop app

on:
  push:
    branches: [main, 'linux-branch', 'linux']
    paths: ['linux/**', 'scripts/hpc_snapshot.py', 'scripts/*linux*.sh', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'scripts/hpc_snapshot.py', 'scripts/*linux*.sh', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'linux/requirements*.txt'
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -r linux/requirements-dev.txt
      - name: Lint and type check
        run: |
          ./.venv/bin/python -m ruff check linux
          ./.venv/bin/python -m ruff format --check linux
          ./.venv/bin/python -m pyright -p linux
      - name: Tests (offline and loopback only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./.venv/bin/python -m pytest -c linux/pyproject.toml linux/tests -q
          ./.venv/bin/python scripts/hpc_snapshot.py --self-test
      - name: Package and smoke test
        run: ./scripts/build_linux_app.sh --skip-install
      - uses: actions/upload-artifact@v4
        with:
          name: LeedsHPCMonitor-Linux-x64
          path: linux/dist/LeedsHPCMonitor-Linux-x64.tar.gz
          if-no-files-found: error
