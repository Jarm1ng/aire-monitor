# Runs every suite (Swift unit and layout tests, collector self-tests, the
# login-flow harness against a fake ssh) through scripts/test_all.sh.
# Nothing here reaches the Leeds clusters or needs credentials. The desktop
# suite runs at most its standard-library tests here (SKIP when the runner's
# python3 has no pytest); windows.yml and linux.yml run it in full.
name: Tests

# A change that touches only the Windows and Linux app (desktop/, its guides,
# build scripts and workflows) is tested in full by windows.yml and
# linux.yml, so it does not also hold a macOS runner for up to 45 minutes.
# The only other reader of those files here is the Swift suite's `bash -n`
# check of every scripts/*.sh (ShellSyntaxTests); linux.yml runs that same
# check on scripts/*linux*.sh, so skipping this job loses nothing. Nothing
# here reads the PowerShell scripts. paths-ignore skips the run
# only when EVERY changed file matches, so a pull request that also touches
# anything else (the collector, Swift, the README, this file) still runs
# here. If this workflow is ever made a required status check, a skipped run
# leaves such a pull request waiting: drop this filter then, or require
# windows.yml/linux.yml instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - 'WINDOWS_APP.md'
      - 'LINUX_APP.md'
      - 'scripts/*windows*.ps1'
      - 'scripts/*linux*.sh'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
  pull_request:
    paths-ignore:
      - 'desktop/**'
      - 'WINDOWS_APP.md'
      - 'LINUX_APP.md'
      - 'scripts/*windows*.ps1'
      - 'scripts/*linux*.sh'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # swift-tools-version 6.0 and swift-testing need Xcode 16 or newer, the
    # default on this image. The runner has a logged-in GUI session, so the
    # minimum-window layout suite runs here too.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
          /usr/bin/python3 --version

      - name: Run every suite
        env:
          # The `runner` context is only available at step level.
          HPC_TEST_BUILD_DIR: ${{ runner.temp }}/hpc-tests-build
          # Three cores: run the Swift tests one at a time, so tests that wait
          # on child processes cannot starve the shared thread pool.
          HPC_SWIFT_TEST_ARGS: --no-parallel
        run: scripts/test_all.sh
